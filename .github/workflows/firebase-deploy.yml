name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    env:
      HAS_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_STARMOTOS_PORTAL }}
      HAS_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Project
        run: npm run build

      - name: Deploy to Firebase Hosting (Service Account)
        if: env.HAS_SERVICE_ACCOUNT != ''
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_STARMOTOS_PORTAL }}'
          channelId: live
          projectId: starmotos-portal

      - name: Deploy to Firebase Hosting (CI Token)
        if: env.HAS_SERVICE_ACCOUNT == '' && env.HAS_TOKEN != ''
        run: npx firebase-tools deploy --only hosting --token "${{ secrets.FIREBASE_TOKEN }}"

      - name: Check Deployment Credentials
        if: env.HAS_SERVICE_ACCOUNT == '' && env.HAS_TOKEN == ''
        run: |
          echo "::error::Falta configurar la credencial en GitHub Secrets! Agrega FIREBASE_SERVICE_ACCOUNT_STARMOTOS_PORTAL o FIREBASE_TOKEN en Settings > Secrets and variables > Actions."
          exit 1
