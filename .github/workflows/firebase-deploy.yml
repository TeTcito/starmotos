name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Project
        run: npm run build

      - name: Deploy to Firebase Hosting
        env:
          RAW_CREDENTIAL: ${{ secrets.FIREBASE_TOKEN || secrets.FIREBASE_SERVICE_ACCOUNT_STARMOTOS_PORTAL || vars.FIREBASE_TOKEN || vars.FIREBASE_SERVICE_ACCOUNT_STARMOTOS_PORTAL }}
        run: |
          if [ -z "$RAW_CREDENTIAL" ]; then
            echo "::error::No se encontró credencial en GitHub Secrets. Agrega FIREBASE_TOKEN o FIREBASE_SERVICE_ACCOUNT_STARMOTOS_PORTAL en Repository secrets."
            exit 1
          fi
          if [[ "$RAW_CREDENTIAL" =~ ^\{ ]]; then
            echo "::notice::Detectada Service Account JSON de Firebase."
            echo "$RAW_CREDENTIAL" > "$RUNNER_TEMP/sa.json"
            export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          else
            echo "::notice::Detectado Token CI de Firebase."
            export FIREBASE_TOKEN="$RAW_CREDENTIAL"
          fi
          npx --yes firebase-tools deploy --only hosting --project starmotos-portal --non-interactive 2>&1 | tee deploy.log
          echo "### Firebase Deploy Log" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat deploy.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          if grep -q "Deploy complete!" deploy.log; then
            echo "Deploy successful!"
          else
            while IFS= read -r line; do
              echo "::error::$line"
            done < deploy.log
            exit 1
          fi

