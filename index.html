<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/pwa-192.png" />
    <link rel="shortcut icon" href="/pwa-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <!-- Título Principal y Meta Descripción -->
    <title>StarMotos | Portal de Clientes y Taller Especializado</title>
    <meta name="description" content="Seguimiento en tiempo real de tu moto, agendamiento de citas técnicas, historial de mantenimientos y facturación electrónica SRI." />
    <meta name="author" content="StarMotos" />

    <!-- Open Graph / WhatsApp / Facebook Link Preview -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="StarMotos" />
    <meta property="og:title" content="StarMotos | Portal de Clientes y Taller Especializado" />
    <meta property="og:description" content="Seguimiento en tiempo real de tu moto, agendamiento de citas técnicas, historial de mantenimientos y facturación electrónica SRI." />
    <meta property="og:image" content="/og-image.jpg" />
    <meta property="og:image:secure_url" content="/og-image.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="675" />
    <meta property="og:image:alt" content="StarMotos - Portal de Clientes y Taller Especializado" />
    <meta property="og:locale" content="es_EC" />
    <link rel="image_src" href="/og-image.jpg" />

    <!-- Twitter / Telegram Card Preview -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="StarMotos | Portal de Clientes y Taller Especializado" />
    <meta name="twitter:description" content="Seguimiento en tiempo real de tu moto, agendamiento de citas técnicas, historial de mantenimientos y facturación electrónica SRI." />
    <meta name="twitter:image" content="/og-image.jpg" />

    <!-- Script para asegurar URLs absolutas en og:image y og:url -->
    <script>
      (function() {
        try {
          if (window.location && window.location.origin) {
            var origin = window.location.origin;
            var ogImg = document.querySelector('meta[property="og:image"]');
            if (ogImg && ogImg.content && !ogImg.content.startsWith('http')) {
              ogImg.content = origin + ogImg.getAttribute('content');
            }
            var ogSec = document.querySelector('meta[property="og:image:secure_url"]');
            if (ogSec && ogSec.content && !ogSec.content.startsWith('http')) {
              ogSec.content = origin + ogSec.getAttribute('content');
            }
            var twImg = document.querySelector('meta[name="twitter:image"]');
            if (twImg && twImg.content && !twImg.content.startsWith('http')) {
              twImg.content = origin + twImg.getAttribute('content');
            }
          }
        } catch(e) {}
      })();
    </script>

    <!-- PWA & Dispositivos Móviles -->
    <meta name="theme-color" content="#ffffff" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="StarMotos" />
    <link rel="apple-touch-icon" href="/pwa-512.png" />
    <link rel="manifest" href="/manifest.json" />
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-white text-zinc-900 antialiased selection:bg-blue-600 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
