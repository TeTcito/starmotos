<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <!-- Background Glow -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0"/>
    </radialGradient>

    <!-- Shield Gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="40%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Crimson Border Gradient -->
    <linearGradient id="crimsonBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="50%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>

    <!-- Lock Gold/Amber Gradient -->
    <linearGradient id="lockBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <!-- Shackle Metallic Gradient -->
    <linearGradient id="shackleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f1f5f9"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>

    <!-- Red Banner Gradient -->
    <linearGradient id="bannerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="50%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <filter id="glowFilter" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#ef4444" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="120" cy="120" r="110" fill="url(#bgGlow)"/>

  <!-- Shield Base Shape -->
  <path d="M 120 18 Q 185 24 196 68 Q 198 126 120 206 Q 42 126 44 68 Q 55 24 120 18 Z" 
        fill="url(#shieldGrad)" 
        stroke="url(#crimsonBorder)" 
        stroke-width="4.5"
        filter="url(#shadow)" />

  <!-- Inner Shield Trim Line -->
  <path d="M 120 28 Q 174 33 183 70 Q 185 119 120 188 Q 55 119 57 70 Q 66 33 120 28 Z" 
        fill="none" 
        stroke="#ef4444" 
        stroke-width="1.2" 
        stroke-opacity="0.4"
        stroke-dasharray="4 3" />

  <!-- Shackle (Arco del Candado cerrado) -->
  <path d="M 98 106 V 82 C 98 68 142 68 142 82 V 106" 
        fill="none" 
        stroke="url(#shackleGrad)" 
        stroke-width="11" 
        stroke-linecap="round"
        filter="url(#shadow)" />

  <!-- Lock Body (Cuerpo del Candado) -->
  <rect x="86" y="102" width="68" height="52" rx="10" 
        fill="url(#lockBody)" 
        stroke="#fef08a" 
        stroke-width="1.5"
        filter="url(#shadow)" />

  <!-- Keyhole (Ojo de la cerradura) -->
  <circle cx="120" cy="122" r="5" fill="#1e1b4b"/>
  <polygon points="117,124 123,124 121,137 119,137" fill="#1e1b4b"/>

  <!-- Warning Badge / Circle Slash Icon -->
  <g transform="translate(144, 134)" filter="url(#glowFilter)">
    <circle cx="16" cy="16" r="15" fill="#dc2626" stroke="#ffffff" stroke-width="2.5"/>
    <line x1="6" y1="6" x2="26" y2="26" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Banner "ACCESO DENEGADO" -->
  <g transform="translate(120, 184)" filter="url(#shadow)">
    <!-- Banner Background -->
    <rect x="-82" y="-12" width="164" height="24" rx="12" 
          fill="url(#bannerGrad)" 
          stroke="#ffffff" 
          stroke-width="1.5"/>
    
    <!-- Banner Text -->
    <text x="0" y="4.5" 
          fill="#ffffff" 
          font-family="system-ui, -apple-system, sans-serif" 
          font-size="10.5" 
          font-weight="900" 
          letter-spacing="1.2" 
          text-anchor="middle">ACCESO DENEGADO</text>
  </g>
</svg>
